[package]
name = "osu-offset-suggester"
version = "1.0.0"
edition = "2024"
description = "Suggests global and per-beatmap offsets for osu! stable from your recent plays' hit errors"
license = "GPL-3.0-or-later"
repository = "https://github.com/zNyash/osu-offset-suggester"
publish = false

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
memchr = "2.8.3"
proc-maps = "0.5.0"
ratatui = "0.30.2"
read-process-memory = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"

# The signature scan is hot; keep memchr fast even in debug builds.
[profile.dev.package.memchr]
opt-level = 3

# Smaller, faster release binaries.
[profile.release]
lto = true
codegen-units = 1
strip = true
